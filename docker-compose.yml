services:
  postgres:
    image: postgres:15-alpine
    container_name: starwars-movies-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-movies_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-movies_pass}
      POSTGRES_DB: ${DB_NAME:-movies_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
